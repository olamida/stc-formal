name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {path: stc-formal}
      - uses: actions/checkout@v4          # sibling dependency; adjust owner/repo to your account
        with: {repository: olamida/stc-corridors, path: stc-corridors}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install numpy matplotlib pytest
      - run: cd stc-formal && PYTHONPATH=src python -m pytest -q tests
